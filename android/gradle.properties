# Gradle JVM memory allocation settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Enable non-transitive R classes for faster build times
android.nonTransitiveAppRClass=true

# Optimization flags
org.gradle.parallel=true
org.gradle.caching=true
# Force Gradle to use Eclipse Temurin Java 17
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.18.8-hotspot